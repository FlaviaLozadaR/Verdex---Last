<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1280px;height:800px;background:#1E3826;}
  svg{display:block;}
</style>
</head>
<body>
<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#2E4F35"></stop>
      <stop offset="55%" stop-color="#20402A"></stop>
      <stop offset="100%" stop-color="#152C1C"></stop>
    </radialGradient>
    <linearGradient id="hubFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0B84E"></stop>
      <stop offset="100%" stop-color="#D99A2E"></stop>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B4CC93"></stop>
      <stop offset="100%" stop-color="#93B473"></stop>
    </linearGradient>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0C1A10" flood-opacity="0.45"></feDropShadow>
    </filter>
    <filter id="hubShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0C1A10" flood-opacity="0.5"></feDropShadow>
    </filter>

    <symbol id="ic-person" viewBox="0 0 24 30">
      <circle cx="12" cy="7.2" r="6.4"></circle>
      <path d="M2 29 C2 19.6 6.3 15.2 12 15.2 C17.7 15.2 22 19.6 22 29 Z"></path>
    </symbol>

    <symbol id="ic-building" viewBox="0 0 24 30">
      <rect x="3" y="3" width="18" height="27" rx="1.4"></rect>
      <g fill="var(--hole)">
        <rect x="6.2" y="7" width="3.4" height="3.4"></rect>
        <rect x="14.4" y="7" width="3.4" height="3.4"></rect>
        <rect x="6.2" y="13" width="3.4" height="3.4"></rect>
        <rect x="14.4" y="13" width="3.4" height="3.4"></rect>
        <rect x="6.2" y="19" width="3.4" height="3.4"></rect>
        <rect x="14.4" y="19" width="3.4" height="3.4"></rect>
        <rect x="10" y="25.2" width="4" height="4.8"></rect>
      </g>
    </symbol>

    <symbol id="ic-truck" viewBox="0 0 34 26">
      <rect x="1" y="9" width="12" height="10" rx="1.3"></rect>
      <rect x="13" y="3.5" width="18" height="15.5" rx="1.3"></rect>
      <rect x="3.6" y="11.4" width="5.4" height="4.2" rx="0.5" fill="var(--hole)"></rect>
      <circle cx="8" cy="20.6" r="2.9"></circle>
      <circle cx="24" cy="20.6" r="2.9"></circle>
      <circle cx="8" cy="20.6" r="1.15" fill="var(--hole)"></circle>
      <circle cx="24" cy="20.6" r="1.15" fill="var(--hole)"></circle>
    </symbol>

    <symbol id="ic-chase" viewBox="0 0 32 32">
      <path d="M16 3 L27 22 H5 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path>
      <path d="M14.5 3.6 L20 9 L14 9 Z" fill="currentColor"></path>
      <path d="M26.3 21.6 L20.5 24.8 L22.3 18.6 Z" fill="currentColor"></path>
      <path d="M5.7 21.6 L11.5 24.8 L9.7 18.6 Z" fill="currentColor"></path>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1280" height="800" fill="url(#bgGlow)"></rect>

  <!-- eyebrow -->
  <g transform="translate(70,58)" fill="#BFE3AE">
    <svg x="0" y="-16" width="20" height="20"><use href="#ic-chase" color="#BFE3AE"></use></svg>
    <text x="30" y="0" font-family="Cascadia Code, Consolas, monospace" font-size="15" letter-spacing="3" fill="#BFE3AE">ECOSISTEMA VERDEX</text>
  </g>

  <!-- connectors (drawn first, under nodes) -->
  <g stroke="#CFE6BD" stroke-width="2.6" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.85">
    <line x1="640" y1="300" x2="291" y2="150"></line>
    <line x1="640" y1="300" x2="989" y2="150"></line>
    <line x1="640" y1="300" x2="640" y2="522"></line>
  </g>

  <!-- Usuarios -->
  <g transform="translate(215,150)">
    <circle r="78" fill="url(#nodeFill)" filter="url(#softShadow)"></circle>
    <g style="--hole:#B9D19A" fill="#1E3826" transform="translate(-30,-42)">
      <use href="#ic-person" width="24" height="30" transform="translate(6,4) scale(0.92)"></use>
      <use href="#ic-person" width="24" height="30" transform="translate(20,0)" opacity="0.55"></use>
    </g>
    <text x="0" y="16" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#12240F">Usuarios</text>
    <text x="0" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#EAF4E1">
      <tspan x="0" dy="0">Reciclan y obtienen</tspan>
      <tspan x="0" dy="20">recompensas reales</tspan>
    </text>
  </g>

  <!-- Empresas -->
  <g transform="translate(1065,150)">
    <circle r="78" fill="url(#nodeFill)" filter="url(#softShadow)"></circle>
    <g style="--hole:#B9D19A" fill="#1E3826" transform="translate(-12,-44)">
      <use href="#ic-building" width="24" height="30"></use>
    </g>
    <text x="0" y="16" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#12240F">Empresas</text>
    <text x="0" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#EAF4E1">
      <tspan x="0" dy="0">Reciben un</tspan>
      <tspan x="0" dy="20">Dashboard ESG</tspan>
    </text>
  </g>

  <!-- Recicladores -->
  <g transform="translate(640,600)">
    <circle r="78" fill="url(#nodeFill)" filter="url(#softShadow)"></circle>
    <g style="--hole:#B9D19A" fill="#1E3826" transform="translate(-17,-46)">
      <use href="#ic-truck" width="34" height="26"></use>
    </g>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#12240F">Recicladores</text>
    <text x="0" y="103" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#EAF4E1">
      <tspan x="0" dy="0">Digitalizan su proceso</tspan>
    </text>
  </g>

  <!-- Hub -->
  <g transform="translate(640,300)">
    <circle r="98" fill="none" stroke="#F0B84E" stroke-opacity="0.35" stroke-width="1.5"></circle>
    <circle r="92" fill="url(#hubFill)" filter="url(#hubShadow)"></circle>
    <text x="0" y="9" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="30" letter-spacing="1" fill="#1E3826">VERDEX</text>
  </g>

  <!-- tagline -->
  <text x="70" y="728" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="27" fill="#F0B84E">
    Residuos en datos. Datos en impacto. Impacto en valor.
  </text>
</svg>
</body>
</html>
